name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      source_repo:
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup Minikube (for local test)
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          kubernetes-version: 'stable'
          addons: ingress

      - name: 🧩 Apply Kubernetes manifests
        run: |
          set -e
          kubectl apply -f k8s/namespace.yaml || echo "(already exists)"
          kubectl wait --for=condition=Established --timeout=30s ns/deawkoikid || true
          kubectl apply -f k8s/
          kubectl get pods -n deawkoikid
          echo "Done"
